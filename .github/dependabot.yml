version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule: {interval: monthly}
  open-pull-requests-limit: 2
  groups:
    minor-and-patch:
      update-types: [minor, patch]
  ignore:
  - dependency-name: '*'
    update-types: ['version-update:semver-major']
- package-ecosystem: github-actions
  directory: /
  schedule: {interval: monthly}
  open-pull-requests-limit: 2
  groups:
    minor-and-patch:
      update-types: [minor, patch]
  ignore:
  - dependency-name: '*'
    update-types: ['version-update:semver-major']
