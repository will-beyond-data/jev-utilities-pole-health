[project]
name = "polehealth"
version = "0.1.0"
description = "Demo: Matilda Jev triages electricity pole health from a photo and an asset record"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pillow>=10.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
space = ["gradio_client"]

[project.scripts]
polehealth = "polehealth.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polehealth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
